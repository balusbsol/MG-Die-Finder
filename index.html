function render(){const rows=$("rows");$("exactTab").classList.toggle("active",tab==="exact");$("closeTab").classList.toggle("active",tab==="close");if(tab==="exact"){rows.innerHTML=results.exact.length?results.exact.map(r=>row(r,false)).join(""):'<div class="empty">No exact matches. Open Close Variants for nearby sizes.</div>'}else{if(!results.close.length){rows.innerHTML='<div class="empty">No close variants found.</div>';return}const groups=new Map;results.close.forEach(r=>{const k=Math.min(num(r.width),num(r.height))+" × "+Math.max(num(r.width),num(r.height));if(!groups.has(k))groups.set(k,[]);groups.get(k).push(r)});rows.innerHTML=[...groups].map(([k,v])=>'<div class="group">'+k+' in · '+v.length+' dies</div>'+v.map(r=>row(r,true)).join("")).join("")}rows.querySelectorAll(".preview").forEach(b=>b.onclick=()=>{$("modalTitle").textContent=b.dataset.die;$("modalImg").src=b.dataset.img;$("modal").showModal()})}
$("sizeMode").onclick=()=>{mode="size";$("sizeMode").className="active";$("dieMode").className="";$("wl").hidden=$("hl").hidden=false;$("dl").hidden=true;tab="exact";run()};$("dieMode").onclick=()=>{mode="die";$("dieMode").className="active";$("sizeMode").className="";$("wl").hidden=$("hl").hidden=true;$("dl").hidden=false;tab="exact";run()};$("go").onclick=run;$("nup").onchange=run;$("width").oninput=()=>$("area").textContent=((Number($("width").value)*Number($("height").value))||0).toFixed(2)+" sq in";$("height").oninput=$("width").oninput;$("exactTab").onclick=()=>{tab="exact";render()};$("closeTab").onclick=()=>{if(mode==="size"){tab="close";render()}};$("modalClose").onclick=()=>$("modal").close();
function csv(text){const out=[];let row=[],cell="",q=false;for(let i=0;i<text.length;i++){const c=text[i],n=text[i+1];if(c==='"'&&q&&n==='"'){cell+='"';i++}else if(c==='"')q=!q;else if(c===","&&!q){row.push(cell);cell=""}else if((c==="\n"||c==="\r")&&!q){if(c==="\r"&&n==="\n")i++;row.push(cell);if(row.some(x=>x!==""))out.push(row);row=[];cell=""}else cell+=c}if(cell||row.length){row.push(cell);out.push(row)}const h=out.shift()||[];return out.map(r=>Object.fromEntries(h.map((x,i)=>[x,r[i]??""])))}
$("sheetLoad").onclick=async()=>{try{const u=$("sheetUrl").value.trim(),m=u.match(/spreadsheets\/d\/([a-zA-Z0-9-_]+)/);if(!m)throw Error("Paste a valid Google Sheet URL");const gid=(u.match(/[?&#]gid=(\d+)/)||[])[1]||"0";const url="https://docs.google.com/spreadsheets/d/"+m[1]+"/gviz/tq?tqx=out:csv&gid="+gid;const res=await fetch(url);if(!res.ok)throw Error("Google Sheet could not be read");setRecords(csv(await res.text()),"Google Sheet");localStorage.setItem("dieFinderSheet",u)}catch(e){alert(e.message+" — share the sheet as Anyone with the link: Viewer.")}};
$("file").onchange=async e=>{try{const f=e.target.files[0];if(!f)return;let rows;if(f.name.toLowerCase().endsWith(".csv"))rows=csv(await f.text());else{if(!window.XLSX)throw Error("Excel reader did not load");const wb=XLSX.read(await f.arrayBuffer());const ws=wb.Sheets.Master||wb.Sheets[wb.SheetNames[0]];rows=XLSX.utils.sheet_to_json(ws,{defval:""})}setRecords(rows,f.name)}catch(e){alert(e.message)}};$("reset").onclick=()=>{localStorage.removeItem("dieFinderRecords");localStorage.removeItem("dieFinderLabel");records=EMBEDDED;updateNup();$("status").textContent=records.length.toLocaleString()+" dies · embedded master";run()};
try{const saved=localStorage.getItem("dieFinderRecords");if(saved)records=JSON.parse(saved);$("sheetUrl").value=localStorage.getItem("dieFinderSheet")||""}catch{}updateNup();$("status").textContent=records.length.toLocaleString()+" dies · "+(localStorage.getItem("dieFinderLabel")||"embedded master");run();</script></body></html>
